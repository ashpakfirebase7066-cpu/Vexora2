name: Fix Vexora2 timeline scale

on:
  push:
    paths:
      - '.github/workflows/fix-timeline-scale.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch timeline UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/vexora/editor/MainActivity.kt')
          s = p.read_text()

          # Prevent the source image from being re-cropped/zoomed as the clip width changes.
          s = s.replace(
              'AsyncImage(clip.uri, "Timeline image", Modifier.fillMaxSize(), contentScale = ContentScale.Crop)',
              'AsyncImage(clip.uri, "Timeline image", Modifier.fillMaxSize(), contentScale = ContentScale.Fit)'
          )

          # Replace the sparse clip-start labels with a real 0s -> end ruler.
          new_markers = r'''@Composable
private fun TimeMarkers(clips: List<Clip>, contentWidth: Float, pixelsPerSecond: Float) {
    val totalMs = clips.sumOf { it.duration }
    val totalSeconds = max(1, kotlin.math.ceil(totalMs / 1000.0).toInt())

    Row(
        Modifier.width(contentWidth.dp).height(32.dp).background(Color(0xFF15161A)),
        verticalAlignment = Alignment.Top
    ) {
        for (second in 0..totalSeconds) {
            val x = second * pixelsPerSecond
            if (x <= contentWidth + 1f) {
                Column(
                    Modifier.width(if (second == totalSeconds) 1.dp else pixelsPerSecond.dp)
                        .fillMaxHeight(),
                    horizontalAlignment = Alignment.Start
                ) {
                    Box(Modifier.width(1.dp).height(6.dp).background(SecondaryText))
                    Text(
                        "${second}s",
                        color = SecondaryText,
                        fontSize = 7.sp,
                        modifier = Modifier.padding(top = 2.dp)
                    )
                }
            }
        }
    }
}

'''
          pattern = r'@Composable\nprivate fun TimeMarkers\(clips: List<Clip>, contentWidth: Float, pixelsPerSecond: Float\) \{.*?\n\}\n\n@Composable\nprivate fun BottomTools'
          replacement = new_markers + '@Composable\nprivate fun BottomTools'
          s2, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'TimeMarkers replacement count={n}')
          p.write_text(s2)
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexora2-debug-apk-timeline-scale
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/vexora/editor/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No source changes'
          else
            git commit -m 'Fix timeline image scaling and add full 0s to end ruler'
            git push
          fi
