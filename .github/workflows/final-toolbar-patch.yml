name: Final toolbar patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/vexora/editor/MainActivity.kt')
          s=p.read_text()
          # Compile fix
          s=s.replace('pointerInput(clip.id, clip.duration)', 'pointerInput(clip.id)')
          # Add toggle state once
          if 'var toolbarVisible by remember' not in s:
              s=s.replace('var selected by remember { mutableIntStateOf(-1) }','var selected by remember { mutableIntStateOf(-1) }\n    var toolbarVisible by remember { mutableStateOf(false) }')
          # Toggle when tapping the same clip; show when tapping another clip.
          s=s.replace('onSelect = { selected = it },','onSelect = { index ->\n                if (selected == index) toolbarVisible = !toolbarVisible\n                else { selected = index; toolbarVisible = true }\n            },')
          # Hide after deleting the selected clip if nothing remains.
          s=s.replace('selected = if (clips.isEmpty()) -1 else selected.coerceAtMost(clips.lastIndex)\n                }','selected = if (clips.isEmpty()) -1 else selected.coerceAtMost(clips.lastIndex)\n                    toolbarVisible = selected >= 0\n                }',1)
          p.write_text(s)
          PY
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Vexora2-debug-apk-final-toolbar
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/vexora/editor/MainActivity.kt
          if ! git diff --cached --quiet; then git commit -m 'Toggle selected clip toolbar'; git push; fi
