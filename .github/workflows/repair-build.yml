name: Repair Vexora2 build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Compose pointerInput signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vexora/editor/MainActivity.kt")
          s = p.read_text()
          old = "pointerInput(clip.id, clip.duration)"
          new = "pointerInput(clip.id)"
          if old not in s:
              raise SystemExit("Expected pointerInput expression was not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/vexora/editor/MainActivity.kt
          git commit -m "Fix timeline resize pointer input compile error"
          git push

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexora2-debug-apk-repaired
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Remove temporary repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary repair workflow"
          git push
