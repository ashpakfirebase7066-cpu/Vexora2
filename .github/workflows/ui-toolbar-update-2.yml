name: Patch Vexora2 toolbar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          sed -i 's/pointerInput(clip.id, clip.duration)/pointerInput(clip.id)/' app/src/main/java/com/vexora/editor/MainActivity.kt
      - name: Build
        run: gradle assembleDebug --stacktrace
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/vexora/editor/MainActivity.kt
          git diff --cached --quiet || (git commit -m 'Fix toolbar selection pointer input' && git push)
